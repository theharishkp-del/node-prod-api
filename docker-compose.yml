# Local/production-like stack: API + MongoDB.
#   docker compose up --build -d
#   docker compose logs -f api
services:
  api:
    build: .
    image: node-prod-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/node_prod_api
      LOG_DIR: /app/logs
      TRUST_PROXY: "false"
    ports:
      - "3000:3000"
    volumes:
      - api-logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
    stop_grace_period: 20s

  mongo:
    image: mongo:7
    restart: unless-stopped
    # No auth for local use. For anything exposed, set MONGO_INITDB_ROOT_USERNAME /
    # MONGO_INITDB_ROOT_PASSWORD (from a secret store) and put credentials in MONGODB_URI.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  api-logs:
  mongo-data:
