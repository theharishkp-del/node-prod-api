# nginx: proxy https://devvir.cognitivemobile.net/iqagent/ -> Node on 127.0.0.1:3000
#
# proxy_pass has NO trailing slash / URI, so nginx forwards the full path including the
# /iqagent prefix (e.g. /iqagent/portal/orders/5). The app mounts everything under
# APP_BASE_PATH=/iqagent, so the prefix must be preserved.
# The app does not enable Express "trust proxy", so req.ip in the access log is nginx's
# address; the real client IP is in the X-Real-IP / X-Forwarded-For headers set below.

server {
    listen 443 ssl http2;
    server_name devvir.cognitivemobile.net;

    # ssl_certificate     /etc/letsencrypt/live/devvir.cognitivemobile.net/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/devvir.cognitivemobile.net/privkey.pem;

    # /iqagent (no slash) -> /iqagent/
    location = /iqagent { return 301 /iqagent/; }

    location /iqagent/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 60s;
        client_max_body_size 1m;   # keep >= BODY_LIMIT
    }
}
