<form [formGroup]="form" (ngSubmit)="onNext()" class="space-y-5 rounded-2xl bg-white p-2">
  <div class="flex items-start justify-between gap-4">
    <div>
      <h2 class="text-xl font-semibold text-slate-900">Branch Details</h2>
      <p class="mt-1 text-sm text-slate-600">Add one or more branches. At least one branch is required before moving to user registration.</p>
    </div>
    <span class="rounded-full bg-cyan-50 px-3 py-1 text-xs font-semibold text-cyan-700">Step 2 of 3</span>
  </div>

  <div formArrayName="branches" class="space-y-5">
    <section
      *ngFor="let branchGroup of branches.controls; let index = index"
      [formGroupName]="index"
      class="space-y-4 rounded-2xl border border-slate-200 p-4"
    >
      <div class="flex items-start justify-between gap-3">
        <div>
          <h3 class="text-base font-semibold text-slate-900">Branch {{ index + 1 }}</h3>
          <p class="text-sm text-slate-500">Capture the branch name and confirmed map location.</p>
        </div>
        <button
          *ngIf="branches.length > 1"
          type="button"
          class="btn-danger"
          (click)="removeBranch(index)"
        >
          Remove
        </button>
      </div>

      <div>
        <label class="form-label" [for]="'branchName-' + index">Branch Name <span class="text-red-500">*</span></label>
        <input [id]="'branchName-' + index" type="text" class="form-input" formControlName="branchName" />
        <p class="form-error" *ngIf="hasError(index, 'branchName', 'required')">Branch name is required.</p>
      </div>

      <app-address-picker formControlName="address" [label]="'Branch Address'" [required]="true"></app-address-picker>
    </section>
  </div>

  <div class="flex justify-start">
    <button type="button" class="btn-secondary" (click)="addBranch()">Add Another Branch</button>
  </div>

  <div class="flex flex-wrap justify-end gap-3 pt-2">
    <button type="button" class="btn-secondary" (click)="onBack()">Back</button>
    <button type="button" class="btn-secondary" (click)="onReset()">Reset</button>
    <button type="button" class="btn-danger" (click)="onCancel()">Cancel</button>
    <button type="submit" class="btn-primary">Next</button>
  </div>
</form>
