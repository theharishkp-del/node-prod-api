<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/55 px-4 py-6">
  <form [formGroup]="form" class="master-modal" (ngSubmit)="onSubmit()">
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="text-sm font-semibold uppercase tracking-[0.18em] text-cyan-700">Tier Master</p>
        <h3 class="mt-2 text-xl font-semibold text-slate-900">
          {{ mode === 'create' ? 'Add Tier' : (mode === 'edit' ? 'Edit Tier' : 'View Tier') }}
        </h3>
      </div>
      <button type="button" class="close-modal-button" (click)="cancelRequested.emit()">Close</button>
    </div>

    <div *ngIf="errorMessage" class="mt-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800">
      {{ errorMessage }}
    </div>

    <div class="mt-5 grid gap-4 md:grid-cols-2">
      <div>
        <label class="form-label">Tier Key</label>
        <input class="form-input" formControlName="tierKey" />
        <p class="form-error" *ngIf="form.get('tierKey')?.touched && form.get('tierKey')?.hasError('required')">Tier key is required.</p>
        <p class="form-error" *ngIf="form.get('tierKey')?.touched && form.get('tierKey')?.hasError('duplicateTierKey')">This tier key already exists. Please choose another one.</p>
      </div>
      <div>
        <label class="form-label">Multiplier</label>
        <input type="number" step="0.01" min="0" class="form-input" formControlName="multiplier" />
        <p class="form-error" *ngIf="form.get('multiplier')?.touched && form.get('multiplier')?.invalid">Multiplier is required.</p>
      </div>
      <div class="md:col-span-2">
        <label class="form-label">Tier Name</label>
        <input class="form-input" formControlName="tierName" />
        <p class="form-error" *ngIf="form.get('tierName')?.touched && form.get('tierName')?.hasError('required')">Tier name is required.</p>
      </div>
    </div>

    <div class="mt-6 flex justify-end gap-3">
      <button type="button" class="btn-secondary" (click)="cancelRequested.emit()">Cancel</button>
      <button *ngIf="!isViewMode" type="submit" class="btn-primary" [disabled]="saving">
        {{ saving ? 'Saving...' : (mode === 'edit' ? 'Update Tier' : 'Create Tier') }}
      </button>
    </div>
  </form>
</div>
