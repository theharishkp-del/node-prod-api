<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/55 px-4 py-6">
  <form [formGroup]="form" class="master-modal" (ngSubmit)="onSubmit()">
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="text-sm font-semibold uppercase tracking-[0.18em] text-cyan-700">Quote</p>
        <h3 class="mt-2 text-xl font-semibold text-slate-900">
          {{ mode === 'create' ? 'Add Quote' : (mode === 'edit' ? 'Edit Quote' : 'View Quote') }}
        </h3>
      </div>
      <button type="button" class="close-modal-button" (click)="cancel.emit()">Close</button>
    </div>

    <div *ngIf="errorMessage" class="mt-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800">{{ errorMessage }}</div>

    <div class="mt-5 grid gap-4 md:grid-cols-2">
      <div>
        <label class="form-label">Quote Prefix</label>
        <input
          class="form-input"
          formControlName="quoteNumberPrefix"
          [readonly]="!isCreateMode || isViewMode"
          (input)="onQuotePrefixChange()"
        />
      </div>
      <div>
        <label class="form-label">Quote Number</label>
        <input class="form-input" formControlName="quoteNumber" [readonly]="isCreateMode || isViewMode" />
      </div>
      <div>
        <label class="form-label">Customer <span class="text-red-600">(*)</span></label>
        <select class="form-select" formControlName="customerId">
          <option value="">Select customer</option>
          <option *ngFor="let customer of customers" [value]="customer.id">{{ customer.displayName }}</option>
        </select>
      </div>
      <div>
        <label class="form-label">Quote Date <span class="text-red-600">(*)</span></label>
        <input type="date" class="form-input" formControlName="quoteDate" />
      </div>
      <div>
        <label class="form-label">Expiry Date</label>
        <input type="date" class="form-input" formControlName="expiryDate" />
      </div>
      <div>
        <label class="form-label">Status <span class="text-red-600">(*)</span></label>
        <select class="form-select" formControlName="status">
          <option value="draft">Draft</option>
          <option value="sent">Sent</option>
          <option value="accepted">Accepted</option>
          <option value="declined">Declined</option>
          <option value="expired">Expired</option>
        </select>
      </div>
      <div class="md:col-span-2">
        <label class="form-label">Notes</label>
        <textarea class="form-input min-h-24" formControlName="notes"></textarea>
      </div>
      <div class="md:col-span-2">
        <label class="form-label">Terms and Conditions</label>
        <textarea class="form-input min-h-24" formControlName="termsAndConditions"></textarea>
      </div>
    </div>

    <div class="mt-6 space-y-3">
      <div class="flex items-center justify-between gap-3">
        <h4 class="text-base font-semibold text-slate-900">Line Items</h4>
        <button *ngIf="!isViewMode" type="button" class="btn-secondary" (click)="addLineItem()">Add Line Item</button>
      </div>
      <div class="space-y-3">
        <div *ngFor="let lineItem of lineItems.controls; let index = index" [formGroup]="lineItem" class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
          <div class="grid gap-3 md:grid-cols-6">
            <div class="md:col-span-2">
              <label class="line-item-label">Item Name <span class="text-red-600">(*)</span></label>
              <input class="form-input" formControlName="name" placeholder="Item name" />
            </div>
            <div>
              <label class="line-item-label">Quantity <span class="text-red-600">(*)</span></label>
              <input class="form-input" type="number" formControlName="quantity" placeholder="Qty" />
            </div>
            <div>
              <label class="line-item-label">Rate <span class="text-red-600">(*)</span></label>
              <input class="form-input" type="number" formControlName="rate" placeholder="Rate" />
            </div>
            <div>
              <label class="line-item-label">Discount</label>
              <input class="form-input" type="number" formControlName="discount" placeholder="Discount" />
            </div>
            <div>
              <label class="line-item-label">Tax %</label>
              <input class="form-input" type="number" formControlName="taxPercentage" placeholder="Tax %" />
            </div>
            <div class="md:col-span-4">
              <label class="line-item-label">Description</label>
              <textarea class="form-input min-h-20" formControlName="description" placeholder="Description"></textarea>
            </div>
            <div class="md:col-span-2 flex items-end justify-between gap-3">
              <span class="text-sm font-semibold text-slate-700">Preview Total: {{ getPreviewTotal(index) | number:'1.2-2' }}</span>
              <button *ngIf="!isViewMode" type="button" class="btn-danger" (click)="removeLineItem(index)">Remove</button>
            </div>
          </div>
        </div>
      </div>
      <p class="text-right text-sm font-semibold text-slate-700">Estimated Grand Total: {{ overallTotal | number:'1.2-2' }}</p>
    </div>

    <div class="mt-6 flex flex-wrap justify-end gap-3">
      <button type="button" class="btn-secondary" (click)="cancel.emit()">{{ isViewMode ? 'Close' : 'Cancel' }}</button>
      <button *ngIf="!isViewMode" type="submit" class="btn-primary" [disabled]="saving">
        {{ saving ? 'Saving...' : (mode === 'create' ? 'Create Quote' : 'Save Changes') }}
      </button>
    </div>
  </form>
</div>
