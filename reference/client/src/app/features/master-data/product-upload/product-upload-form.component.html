<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/55 px-4 py-6">
  <form [formGroup]="form" class="master-modal" (ngSubmit)="onSubmit()">
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="text-sm font-semibold uppercase tracking-[0.18em] text-cyan-700">Inventory</p>
        <h3 class="mt-2 text-xl font-semibold text-slate-900">
          {{ mode === 'create' ? 'Add Product' : (mode === 'edit' ? 'Edit Product' : 'View Product') }}
        </h3>
      </div>
      <button type="button" class="close-modal-button" (click)="cancelRequested.emit()">Close</button>
    </div>

    <div *ngIf="errorMessage" class="mt-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800">
      {{ errorMessage }}
    </div>

    <div class="mt-5 grid gap-4 md:grid-cols-2">
      <div>
        <label class="form-label">SKU</label>
        <input class="form-input" formControlName="sku" />
      </div>
      <div>
        <label class="form-label">Item Name</label>
        <input class="form-input" formControlName="itemName" />
      </div>
      <div>
        <label class="form-label">Category</label>
        <input class="form-input" formControlName="category" />
      </div>
      <div>
        <label class="form-label">Finish</label>
        <input class="form-input" formControlName="finish" />
      </div>
      <div class="md:col-span-2">
        <label class="form-label">Description</label>
        <textarea class="form-input min-h-24" formControlName="description"></textarea>
      </div>
      <div>
        <label class="form-label">Sales Price</label>
        <input class="form-input" type="number" step="0.01" formControlName="salesPrice" />
      </div>
      <div>
        <label class="form-label">Purchase Price</label>
        <input class="form-input" type="number" step="0.01" formControlName="purchasePrice" />
      </div>
      <div>
        <label class="form-label">Quantity Available</label>
        <input class="form-input" type="number" step="1" formControlName="qtyAvailable" />
      </div>
      <div>
        <label class="form-label">Unit</label>
        <input class="form-input" formControlName="unit" />
      </div>
      <div>
        <label class="form-label">General SKU</label>
        <input class="form-input" formControlName="generalSku" />
      </div>
      <div>
        <label class="form-label">Style</label>
        <input class="form-input" formControlName="style" />
      </div>
      <div>
        <label class="form-label">Width</label>
        <input class="form-input" type="number" step="0.01" formControlName="width" />
      </div>
      <div>
        <label class="form-label">Height</label>
        <input class="form-input" type="number" step="0.01" formControlName="height" />
      </div>
      <div>
        <label class="form-label">Depth</label>
        <input class="form-input" type="number" step="0.01" formControlName="depth" />
      </div>
      <div>
        <label class="form-label">Lead Time Days</label>
        <input class="form-input" type="number" step="1" formControlName="leadTimeDays" />
      </div>
      <div class="md:col-span-2">
        <label class="form-label">Notes</label>
        <textarea class="form-input min-h-24" formControlName="notes"></textarea>
      </div>
      <div class="md:col-span-2">
        <label class="inline-flex items-center gap-2 text-sm font-medium text-slate-700">
          <input type="checkbox" formControlName="isActive" />
          Product is active
        </label>
      </div>
    </div>

    <div class="mt-6 flex flex-wrap justify-end gap-3">
      <button type="button" class="btn-secondary" (click)="cancelRequested.emit()">{{ isViewMode ? 'Close' : 'Cancel' }}</button>
      <button *ngIf="!isViewMode" type="submit" class="btn-primary" [disabled]="saving">
        {{ saving ? 'Saving...' : (mode === 'create' ? 'Create Product' : 'Save Changes') }}
      </button>
    </div>
  </form>
</div>
