<div>
  <label class="form-label">{{ label }} <span class="text-red-500" *ngIf="required">*</span></label>
  <div class="flex gap-2">
    <div class="flex-1 rounded-md border border-gray-300 bg-white px-3 py-2 shadow-sm focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500">
      <input
        *ngIf="!useNewAutocomplete"
        #autocompleteInput
        type="text"
        class="w-full bg-transparent text-sm outline-none"
        [(ngModel)]="searchText"
        [disabled]="disabled"
        (blur)="markTouched()"
        placeholder="Search address"
      />
      <div #autocompleteHost></div>
    </div>
    <button type="button" class="btn-secondary whitespace-nowrap" (click)="openMapManually()">Open Map</button>
  </div>
  <p class="mt-2 text-sm text-gray-600" *ngIf="searchText">Selected: {{ searchText }}</p>
  <p class="form-error" *ngIf="required && touched && !value.formattedAddress">{{ label }} is required.</p>
</div>

<div *ngIf="showMapPopup" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
  <div class="h-[80vh] w-[80vw] max-w-none rounded-lg bg-white p-4 shadow-lg">
    <h3 class="text-base font-semibold mb-2">Confirm Location</h3>
    <div #mapContainer class="h-[calc(80vh-8rem)] w-full rounded-md border border-gray-300"></div>
    <p class="text-sm text-gray-600 mt-2">{{ searchText }}</p>
    <div class="flex justify-end gap-3 mt-4">
      <button type="button" class="btn-secondary" (click)="cancelPopup()">Cancel</button>
      <button type="button" class="btn-primary" (click)="confirmLocation()">Confirm Address</button>
    </div>
  </div>
</div>
